start": "14:00", "end": "15:30", "title": "竞品对标", "location": "7号会议室", "description": "竞品营销对标分析"}, {"date": "2026-09-28", "start": "10:00", "end": "11:00", "title": "月度汇报", "location": "大会议室", "description": "9月工作汇报"}], "苏慧": [{"date": "2026-09-04", "start": "09:00", "end": "10:00", "title": "项目对齐", "location": "3号会议室", "description": "项目进度对齐"}, {"date": "2026-09-08", "start": "14:00", "end": "15:00", "title": "流程优化", "location": "工位", "description": "工作流程优化"}, {"date": "2026-09-13", "start": "10:00", "end": "11:30", "title": "资源协调", "location": "3号会议室", "description": "跨部门资源协调"}, {"date": "2026-09-18", "start": "14:00", "end": "15:00", "title": "风险排查", "location": "工位", "description": "项目风险排查"}, {"date": "2026-09-23", "start": "10:00", "end": "11:00", "title": "里程碑确认", "location": "5号会议室", "description": "确认下阶段里程碑"}, {"date": "2026-09-27", "start": "14:00", "end": "15:30", "title": "项目总结", "location": "3号会议室", "description": "9月项目总结"}], "王朔": [{"date": "2026-09-03", "start": "14:00", "end": "15:00", "title": "前端开发", "location": "工位", "description": "页面开发"}, {"date": "2026-09-06", "start": "10:00", "end": "11:00", "title": "组件开发", "location": "工位", "description": "通用组件开发"}, {"date": "2026-09-11", "start": "09:00", "end": "10:00", "title": "联调", "location": "工位", "description": "前后端联调"}, {"date": "2026-09-11", "start": "14:00", "end": "15:00", "title": "Bug修复", "location": "工位", "description": "修复已知Bug"}, {"date": "2026-09-15", "start": "10:00", "end": "11:30", "title": "代码评审", "location": "2号会议室", "description": "代码Review"}, {"date": "2026-09-20", "start": "14:00", "end": "15:00", "title": "性能优化", "location": "工位", "description": "页面性能优化"}, {"date": "2026-09-24", "start": "10:00", "end": "11:00", "title": "自测", "location": "工位", "description": "功能自测"}, {"date": "2026-09-26", "start": "14:00", "end": "15:00", "title": "上线支持", "location": "工位", "description": "配合上线"}]}}</script>
<script>
(function() {
  var data = JSON.parse(document.getElementById('cal-data').textContent);
  var members = data.members;
  var allEvents = data.events;
  var currentMember = members[0];
  var currentYear = 2026;
  var currentMonth = 8;

  var eventPalettes = [
    { bg: '#EFF6FF', border: '#3B82F6', text: '#1E40AF' },
    { bg: '#FFF7ED', border: '#F97316', text: '#9A3412' },
    { bg: '#F0FDF4', border: '#22C55E', text: '#166534' },
    { bg: '#FAF5FF', border: '#A855F7', text: '#6B21A8' },
    { bg: '#FFF1F2', border: '#F43F5E', text: '#9F1239' },
    { bg: '#ECFEFF', border: '#06B6D4', text: '#155E75' },
    { bg: '#FEFCE8', border: '#EAB308', text: '#854D0E' },
    { bg: '#FDF2F8', border: '#EC4899', text: '#9D174D' }
  ];

  function getEventColor(index) {
    return eventPalettes[index % eventPalettes.length];
  }

  var weekdays = ['日','一','二','三','四','五','六'];
  var weekdayRow = document.getElementById('weekdayRow');
  for (var i = 0; i < 7; i++) {
    var wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = '周' + weekdays[i];
    weekdayRow.appendChild(wd);
  }

  var tabsEl = document.getElementById('tabs');
  members.forEach(function(m) {
    var tab = document.createElement('div');
    tab.className = 'tab' + (m === currentMember ? ' active' : '');
    tab.textContent = m;
    tab.addEventListener('click', function() {
      currentMember = m;
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      renderCalendar();
    });
    tabsEl.appendChild(tab);
  });

  function getEventsForDate(dateStr) {
    var memberEvents = allEvents[currentMember] || [];
    return memberEvents.filter(function(e) { return e.date === dateStr; });
  }

  function renderCalendar() {
    var calTitle = document.getElementById('calTitle');
    calTitle.textContent = currentYear + '年' + (currentMonth + 1) + '月';
    var calGrid = document.getElementById('calGrid');
    calGrid.innerHTML = '';

    var firstDay = new Date(currentYear, currentMonth, 1);
    var lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    var startWeekday = firstDay.getDay();
    var prevLastDate = new Date(currentYear, currentMonth, 0).getDate();
    var today = new Date();
    var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    var totalCells = Math.ceil((startWeekday + lastDate) / 7) * 7;

    for (var i = 0; i < totalCells; i++) {
      var dayEl = document.createElement('div');
      dayEl.className = 'cal-day';
      var dayNum, dateStr, isCurrentMonth;

      if (i < startWeekday) {
        dayNum = prevLastDate - startWeekday + 1 + i;
        dayEl.classList.add('other-month');
        isCurrentMonth = false;
        var prevMonth = currentMonth === 0 ? 11 : currentMonth - 1;
        var prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
        dateStr = prevYear + '-' + String(prevMonth + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
      } else if (i >= startWeekday + lastDate) {
        dayNum = i - startWeekday - lastDate + 1;
        dayEl.classList.add('other-month');
        isCurrentMonth = false;
        var nextMonth = currentMonth === 11 ? 0 : currentMonth + 1;
        var nextYear = currentMonth === 11 ? currentYear + 1 : currentYear;
        dateStr = nextYear + '-' + String(nextMonth + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
      } else {
        dayNum = i - startWeekday + 1;
        isCurrentMonth = true;
        dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
      }

      if (dateStr === todayStr) dayEl.classList.add('today');

      var numEl = document.createElement('div');
      numEl.className = 'day-num';
      if (isCurrentMonth) {
        var wdIdx = new Date(currentYear, currentMonth, dayNum).getDay();
        if (wdIdx === 0 || wdIdx === 6) numEl.classList.add('weekend');
      }
      numEl.textContent = dayNum;
      dayEl.appendChild(numEl);

      var events = getEventsForDate(dateStr);
      var maxShow = 6;
      events.slice(0, maxShow).forEach(function(ev, idx) {
        var evEl = document.createElement('div');
        evEl.className = 'event-item';
        var palette = getEventColor(idx);
        evEl.style.background = palette.bg;
        evEl.style.borderLeftColor = palette.border;
        evEl.style.color = palette.text;
        evEl.innerHTML = '<span class="event-time">' + ev.start + '</span>' + ev.title;
        evEl.addEventListener('click', function(e) {
          e.stopPropagation();
          openModal(ev, palette);
        });
        dayEl.appendChild(evEl);
      });

      if (events.length > maxShow) {
        var more = document.createElement('div');
        more.style.fontSize = '11px';
        more.style.color = '#94A3B8';
        more.style.padding = '2px 8px';
        more.style.cursor = 'pointer';
        more.textContent = '+' + (events.length - maxShow) + ' more...';
        dayEl.appendChild(more);
      }

      calGrid.appendChild(dayEl);
    }
  }

  function openModal(ev, palette) {
    document.getElementById('modalTitle').textContent = ev.title;
    document.getElementById('modalSubject').textContent = ev.title;
    document.getElementById('modalTime').textContent = ev.date + ' ' + ev.start + ' - ' + ev.end;
    document.getElementById('modalLocation').textContent = ev.location || '无';
    document.getElementById('modalDesc').textContent = ev.description || '无';
    document.getElementById('modalColorBar').style.background = palette.border;
    document.getElementById('modalOverlay').classList.add('show');
  }

  document.getElementById('modalClose').addEventListener('click', function() {
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });
  document.getElementById('prevMonth').addEventListener('click', function() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', function() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  });

  renderCalendar();
})();
</script>
